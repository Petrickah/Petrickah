# Keeps the "Latest from the blog" list in README.md in sync with the blog's RSS feed.
name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch:       # or by hand, from the Actions tab, right after publishing

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://petretiberiu.dev/posts/index.xml"
          max_post_count: 5
          commit_message: "Update the latest blog posts"
